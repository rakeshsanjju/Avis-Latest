<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avis Hospitals | Multilingual Website</title>

  <!-- ✅ GOOGLE TRANSLATE -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: 'en',
          includedLanguages: 'en,te,ta,kn,hi,bn,ml',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        },
        'google_translate_element'
      );
    }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <style>
    /* ===== LANGUAGE–CITY BAR ===== */
    .language-city-bar {
      width: 100%;
      background-color: #0D5174;
      padding: 12px 30px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2000;
    }

    .selector {
      background-color: #fff;
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 25px;
      font-size: 14px;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='black' height='12' viewBox='0 0 24 24' width='12' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 12px;
      padding-right: 28px;
      min-width: 140px;
    }

    @media (max-width: 768px) {
      .language-city-bar {
        justify-content: center;
        flex-wrap: wrap;
        padding: 10px 15px;
      }
      .selector {
        font-size: 13px;
        min-width: 120px;
      }
    }

    /* ===== HIDE GOOGLE BANNER ===== */
    .goog-te-banner-frame.skiptranslate {
      display: none !important;
    }
    body {
      top: 0px !important;
    }
    .goog-logo-link {
      display: none !important;
    }
    .goog-te-gadget {
      color: transparent !important;
    }

    /* ===== PAGE STYLE ===== */
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #ffffff;
      padding-top: 100px;
      color: #0b1f2a;
      overflow-x: hidden;
    }
  </style>
</head>

<body>
  <!-- LANGUAGE–CITY BAR -->
  <div class="language-city-bar">
    <select id="languageSelector" class="selector">
      <option value="en">English</option>
      <option value="te">Telugu</option>
      <option value="ta">Tamil</option>
      <option value="kn">Kannada</option>
      <option value="hi">Hindi</option>
    </select>

    <select class="selector">
      <option>Select City</option>
      <option>Hyderabad</option>
      <option>Bengaluru</option>
      <option>Chennai</option>
      <option>Pune</option>
    </select>
  </div>

  <!-- Hidden Google Translate -->
  <div id="google_translate_element" style="display: none;"></div>

  <!-- HEADER -->
  <header style="background:#e3eff0; text-align:center; padding:20px;">
    <img src="./assets/Avis_Logo-1.webp" alt="Avis Hospitals Logo" style="height:60px;">
  </header>

  <!-- HERO SECTION -->
  <section style="padding:40px; text-align:center;">
    <h1>India’s leading chain of varicose vein centres.</h1>
    <p>Your veins are precious — let us care for them with modern, image-guided laser treatments.</p>
  </section>

  <!-- FOOTER -->
  <footer style="background-color:#c9dede; padding:20px; text-align:center;">
    <p>© 2025 Avis Hospitals — All Rights Reserved.</p>
  </footer>

  <!-- ✅ FIXED LANGUAGE SWITCH SCRIPT -->
  <script>
    // Wait for Google Translate dropdown to load, then change language
    function triggerGoogleTranslate(lang) {
      const interval = setInterval(() => {
        const googleSelect = document.querySelector('.goog-te-combo');
        if (googleSelect) {
          googleSelect.value = lang;
          googleSelect.dispatchEvent(new Event('change'));
          clearInterval(interval);
        }
      }, 500);
    }

    const langDropdown = document.getElementById('languageSelector');

    // Change language on dropdown selection
    langDropdown.addEventListener('change', function () {
      const lang = this.value;
      localStorage.setItem('selectedLang', lang);
      triggerGoogleTranslate(lang);
    });

    // ✅ Restore saved language on reload
    window.addEventListener('load', () => {
      const savedLang = localStorage.getItem('selectedLang') || 'en';
      langDropdown.value = savedLang;
      triggerGoogleTranslate(savedLang);
    });
  </script>
</body>
</html>
